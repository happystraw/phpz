name: Windows Test

on:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/actions/test-variant/**"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - ".github/scripts/setup-php-windows.ps1"
      - ".github/workflows/test-windows.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/actions/test-variant/**"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - ".github/scripts/setup-php-windows.ps1"
      - ".github/workflows/test-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PHP 8.2-8.5 all map to windows-2022 in php/php-windows-builder v1.
  test:
    name: test (PHP ${{ matrix.php }}, x64)
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Zig
        id: zig
        uses: mlugg/setup-zig@v2
      - name: Test CI orchestration
        run: node --test .github/scripts/ci.test.mjs
      - name: Install pkg-config
        id: dependencies
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y
          where.exe pkg-config
      - name: Test NTS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: nts
          debug: 'false'
      - name: Test TS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: ts
          debug: 'false'
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-php-${{ matrix.php }}-logs
          path: build/ci-results/
          if-no-files-found: ignore
