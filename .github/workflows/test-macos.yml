name: macOS Test

on:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/actions/test-variant/**"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - ".github/workflows/test-macos.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/actions/test-variant/**"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - ".github/workflows/test-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (PHP ${{ matrix.php }}, aarch64)
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Zig
        id: zig
        uses: mlugg/setup-zig@v2
      - name: Test CI orchestration
        run: node --test .github/scripts/ci.test.mjs
      - name: Test NTS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: nts
          debug: 'false'
      - name: Test TS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: ts
          debug: 'false'
      - name: Test NTS PHP debug
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: nts
          debug: 'true'
      - name: Test TS PHP debug
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: ts
          debug: 'true'
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-php-${{ matrix.php }}-logs
          path: build/ci-results/
          if-no-files-found: ignore
