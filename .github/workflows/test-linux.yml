name: Linux Test

on:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/actions/test-variant/**"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - "scripts/build-windows.sh"
      - "scripts/test-windows.sh"
      - ".github/workflows/test-linux.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/actions/test-variant/**"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - "scripts/build-windows.sh"
      - "scripts/test-windows.sh"
      - ".github/workflows/test-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x64:
    name: test (PHP ${{ matrix.php }}, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    env:
      XWIN_VERSION: "0.10.0"
      VS_VERSION: ${{ (matrix.php == '8.2' || matrix.php == '8.3') && 'vs16' || 'vs17' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Zig
        id: zig
        uses: mlugg/setup-zig@v2
      - name: Test CI orchestration
        run: node --test .github/scripts/ci.test.mjs
      - name: Cache xwin downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/xwin/${{ env.XWIN_VERSION }}/${{ env.VS_VERSION }}/x86_64
          key: xwin-${{ env.XWIN_VERSION }}-${{ env.VS_VERSION }}-windows-x86_64
      - name: Test NTS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: nts
          debug: 'false'
      - name: Test TS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: ts
          debug: 'false'
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-php-${{ matrix.php }}-logs
          path: build/ci-results/
          if-no-files-found: ignore

  arm64:
    name: test (PHP ${{ matrix.php }}, aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    env:
      XWIN_VERSION: "0.10.0"
      VS_VERSION: ${{ (matrix.php == '8.2' || matrix.php == '8.3') && 'vs16' || 'vs17' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Zig
        id: zig
        uses: mlugg/setup-zig@v2
      - name: Test CI orchestration
        run: node --test .github/scripts/ci.test.mjs
      - name: Cache xwin downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/xwin/${{ env.XWIN_VERSION }}/${{ env.VS_VERSION }}/x86_64
          key: xwin-${{ env.XWIN_VERSION }}-${{ env.VS_VERSION }}-windows-x86_64
      - name: Test NTS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: nts
          debug: 'false'
      - name: Test TS PHP release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        uses: ./.github/actions/test-variant
        with:
          php: ${{ matrix.php }}
          ts: ts
          debug: 'false'
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-php-${{ matrix.php }}-logs
          path: build/ci-results/
          if-no-files-found: ignore
