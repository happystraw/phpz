name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (PHP ${{ matrix.php }}, ${{ matrix.ts }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, ts]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php-config
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Run benchmark
        run: CC=gcc CXX=g++ benchmark/run.sh --samples=11

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.arch }}
          path: benchmark/results/
          if-no-files-found: ignore
