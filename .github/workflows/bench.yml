name: Benchmark checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php-config
          coverage: none

      - name: Install PHPX build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Build and check all three extensions
        run: benchmark/run.sh --check
