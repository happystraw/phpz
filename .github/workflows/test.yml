name: Test

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - name: Install PHP development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y php-dev
      - name: Run tests
        run: |
          PHP_INCLUDE_DIR=$(php-config --include-dir)
          zig build test -Dphp-include-root="$PHP_INCLUDE_DIR"
