name: PHP Built-in Extension Test

on:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/skeleton/**"
      - "examples/my_php_extension/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/scripts/test-builtin-windows.bat"
      - ".github/workflows/test-builtin.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/skeleton/**"
      - "examples/my_php_extension/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/scripts/test-builtin-windows.bat"
      - ".github/workflows/test-builtin.yml"
  workflow_dispatch:
    inputs:
      php:
        description: PHP version
        type: choice
        default: "8.5"
        options: ["8.2", "8.3", "8.4", "8.5"]

permissions:
  contents: read

jobs:
  test:
    name: builtin (${{ matrix.extension }}, PHP ${{ inputs.php || '8.5' }}, ${{ matrix.os }}, ${{ matrix.phpts }}, ${{ matrix.debug && 'debug' || 'release' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest, macos-15-intel]
        phpts: [nts, ts]
        debug: [true, false]
        extension: [skeleton, my_php_extension]
    env:
      PHP_BUILD_VERSION: ${{ inputs.php || '8.5' }}
      PHP_BUILD_TS: ${{ matrix.phpts }}
      PHP_BUILD_DEBUG: ${{ matrix.debug && '1' || '0' }}
      PHP_BUILD_EXTENSION: ${{ matrix.extension }}
      NO_INTERACTION: "1"
      REPORT_EXIT_STATUS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - name: Checkout PHP source
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: PHP-${{ env.PHP_BUILD_VERSION }}
          path: build/php-src
      - name: Prepare extension
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const extension = process.env.PHP_BUILD_EXTENSION;
          const target = `build/php-src/ext/${extension}`;
          fs.rmSync(target, { recursive: true, force: true });
          fs.cpSync(`examples/${extension}`, target, { recursive: true });
          const zon = `${target}/build.zig.zon`;
          fs.writeFileSync(zon, fs.readFileSync(zon, 'utf8').replace('.path = "../.."', '.path = "../../../.."'));
          NODE
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf bison re2c pkg-config
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf bison re2c pkgconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build PHP with extension (Unix)
        if: runner.os != 'Windows'
        working-directory: build/php-src
        run: |
          ./buildconf --force
          zts=--disable-zts
          if [ "$PHP_BUILD_TS" = ts ]; then zts=--enable-zts; fi
          debug=--disable-debug
          if [ "$PHP_BUILD_DEBUG" = 1 ]; then debug=--enable-debug; fi
          ./configure --disable-all --disable-phpdbg --enable-cli --enable-cgi "--enable-$PHP_BUILD_EXTENSION" "$zts" "$debug"
          make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: Test built-in extension (Unix)
        if: runner.os != 'Windows'
        working-directory: build/php-src
        run: |
          export TEST_PHP_EXECUTABLE="$PWD/sapi/cli/php"
          export TEST_PHP_CGI_EXECUTABLE="$PWD/sapi/cgi/php-cgi"
          test -x "$TEST_PHP_CGI_EXECUTABLE"
          "$TEST_PHP_EXECUTABLE" -n -r 'if (!extension_loaded(getenv("PHP_BUILD_EXTENSION")) || (bool) PHP_ZTS !== (getenv("PHP_BUILD_TS") === "ts") || (int) PHP_DEBUG !== (int) getenv("PHP_BUILD_DEBUG")) { exit(1); }'
          "$TEST_PHP_EXECUTABLE" -n -i
          "$TEST_PHP_EXECUTABLE" -n --ri "$PHP_BUILD_EXTENSION"
          "$TEST_PHP_EXECUTABLE" -n run-tests.php -n -q "ext/$PHP_BUILD_EXTENSION/tests"
      - name: Checkout PHP Windows builder
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: php/php-windows-builder
          ref: v1
          path: build/php-windows-builder
      - name: Build and test built-in extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\build\php-windows-builder\php\BuildPhp" -Force
          $vs = Get-VsVersion -PhpVersion $env:PHP_BUILD_VERSION
          Set-Location "$env:GITHUB_WORKSPACE\build"
          Get-PhpSdk
          Set-Location php-src
          Invoke-PhpSdkStarter -BuildDirectory "$env:GITHUB_WORKSPACE\build" -VsConfig $vs -Arch x64 `
            -Task "$env:GITHUB_WORKSPACE\.github\scripts\test-builtin-windows.bat"
