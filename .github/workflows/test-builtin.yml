name: PHP Built-in Extension Test

on:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/skeleton/**"
      - "examples/my_php_extension/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/scripts/test-builtin-windows.bat"
      - ".github/scripts/run-builtin-windows.ps1"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - ".github/workflows/test-builtin.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "src/**"
      - "build/**"
      - "examples/skeleton/**"
      - "examples/my_php_extension/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/scripts/test-builtin-windows.bat"
      - ".github/scripts/run-builtin-windows.ps1"
      - ".github/scripts/ci.mjs"
      - ".github/scripts/ci.test.mjs"
      - ".github/workflows/test-builtin.yml"
  workflow_dispatch:
    inputs:
      php:
        description: PHP version
        type: choice
        default: "8.5"
        options: ["8.2", "8.3", "8.4", "8.5"]

permissions:
  contents: read

jobs:
  test:
    name: builtin (PHP ${{ inputs.php || '8.5' }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest, macos-15-intel]
    env:
      PHP_BUILD_VERSION: ${{ inputs.php || '8.5' }}
      CI_PHP: ${{ inputs.php || '8.5' }}
      NO_INTERACTION: "1"
      REPORT_EXIT_STATUS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Zig
        id: zig
        uses: mlugg/setup-zig@v2
      - name: Test CI orchestration
        run: node --test .github/scripts/ci.test.mjs
      - name: Checkout PHP source
        id: source
        uses: actions/checkout@v5
        with:
          repository: php/php-src
          ref: PHP-${{ env.PHP_BUILD_VERSION }}
          path: build/php-src
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf bison re2c pkg-config
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf bison re2c pkgconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Checkout PHP Windows builder
        if: runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          repository: php/php-windows-builder
          ref: v1
          path: build/php-windows-builder
      - name: Prepare Windows PHP SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\build\php-windows-builder\php\BuildPhp" -Force
          Set-Location "$env:GITHUB_WORKSPACE\build"
          Get-PhpSdk
      - name: Preparation complete
        id: ready
        run: echo 'Dependencies and source ready'
      - name: Test skeleton NTS PHP release
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: nts
          CI_DEBUG: 'false'
          CI_EXTENSION: skeleton
        run: node .github/scripts/ci.mjs builtin
      - name: Test my_php_extension NTS PHP release
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: nts
          CI_DEBUG: 'false'
          CI_EXTENSION: my_php_extension
        run: node .github/scripts/ci.mjs builtin
      - name: Test skeleton TS PHP release
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: ts
          CI_DEBUG: 'false'
          CI_EXTENSION: skeleton
        run: node .github/scripts/ci.mjs builtin
      - name: Test my_php_extension TS PHP release
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: ts
          CI_DEBUG: 'false'
          CI_EXTENSION: my_php_extension
        run: node .github/scripts/ci.mjs builtin
      - name: Test skeleton NTS PHP debug
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: nts
          CI_DEBUG: 'true'
          CI_EXTENSION: skeleton
        run: node .github/scripts/ci.mjs builtin
      - name: Test my_php_extension NTS PHP debug
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: nts
          CI_DEBUG: 'true'
          CI_EXTENSION: my_php_extension
        run: node .github/scripts/ci.mjs builtin
      - name: Test skeleton TS PHP debug
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: ts
          CI_DEBUG: 'true'
          CI_EXTENSION: skeleton
        run: node .github/scripts/ci.mjs builtin
      - name: Test my_php_extension TS PHP debug
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI_TS: ts
          CI_DEBUG: 'true'
          CI_EXTENSION: my_php_extension
        run: node .github/scripts/ci.mjs builtin
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builtin-${{ matrix.os }}-php-${{ inputs.php || '8.5' }}-logs
          path: build/ci-results/
          if-no-files-found: ignore
